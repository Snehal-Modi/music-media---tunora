name: Build and Release Tunora APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build (must start with v, e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error ::Tag name must follow semantic versioning starting with 'v' (e.g. v1.3.0). Provided: $TAG"
              exit 1
            fi
            echo "Release triggered via manual workflow_dispatch for tag: $TAG"
          else
            TAG="${{ github.ref_name }}"
            echo "Release triggered via tag push: $TAG"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Target Release Tag: $TAG"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK and Signature
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error ::Expected APK not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || wc -c < "$APK_PATH")
          if [ "$APK_SIZE" -le 1000000 ]; then
            echo "::error ::APK file size is abnormally small ($APK_SIZE bytes)."
            exit 1
          fi
          echo "Verified APK size: $APK_SIZE bytes"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying cryptographic signature with $APKSIGNER..."
            $APKSIGNER verify --verbose --print-certs "$APK_PATH"
          else
            echo "apksigner not found; fallback to keytool check..."
            keytool -printcert -jarfile "$APK_PATH"
          fi
          echo "APK signature verified successfully!"

      - name: Prepare Release Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Tunora.apk
          ls -lh Tunora.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tunora ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Tunora.apk
