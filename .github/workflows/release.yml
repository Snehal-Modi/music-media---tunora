name: Build and Release Tunora APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build (must start with v, e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error ::Tag name must follow semantic versioning starting with 'v' (e.g. v1.3.0). Provided: $TAG"
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Target Release Tag: $TAG"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate and Configure Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error ::Missing secret: KEYSTORE_BASE64. Release build aborted."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error ::Missing secret: KEYSTORE_PASSWORD. Release build aborted."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error ::Missing secret: KEY_ALIAS. Release build aborted."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error ::Missing secret: KEY_PASSWORD. Release build aborted."
            exit 1
          fi

          echo "Decoding release keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

          if [ ! -s android/app/release.jks ]; then
            echo "::error ::Decoded keystore file is empty or invalid. Release build aborted."
            rm -f android/app/release.jks
            exit 1
          fi

          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Signed Release APK
        run: flutter build apk --release

      - name: Verify APK Signing Certificate
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error ::Expected APK not found at $APK_PATH"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying cryptographic signature with $APKSIGNER..."
            $APKSIGNER verify --verbose --print-certs "$APK_PATH"
          else
            echo "apksigner tool not found; verifying with keytool..."
            keytool -printcert -jarfile "$APK_PATH"
          fi

      - name: Prepare Release Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Tunora.apk
          rm -f android/key.properties android/app/release.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tunora ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Tunora.apk
